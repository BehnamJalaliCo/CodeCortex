[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "codecortex-context-engine"
version = "0.1.0a7"
description = "Context intelligence infrastructure for AI coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Behnam Jalali"}]
keywords = ["ai", "coding-agents", "mcp", "code-intelligence", "context-engine", "distributed-context"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "defusedxml>=0.7,<1",
  "pydantic>=2.8,<3",
  "typer>=0.27.1,<1",
  "rich>=13.7,<15",
]

[project.optional-dependencies]
semantic = ["sentence-transformers>=3,<6"]
parsers = ["tree-sitter-language-pack>=1.15.8,<2"]
web = ["fastapi>=0.116,<1", "uvicorn>=0.35,<1"]
# Pinned exactly, not as a range. CodeCortex parses this engine's JSON stream
# records, so its output shape is part of the integration contract rather than
# an implementation detail. 0.45.3 is the version the conformance tests in
# tests/test_structural_conformance.py run against; a range would let an
# untested release change the record shape silently. `cortex doctor` reports a
# mismatch when a different version is installed anyway.
structural = ["ast-grep-cli==0.45.3"]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=1.4.0",
  "pytest-cov>=6,<8",
  "ruff>=0.16.5",
  "mypy>=1.11",
  "build>=1.2",
  "twine>=7.0.0",
  "httpx>=0.27,<1",
]
security = ["pip-audit>=2.7", "bandit>=1.7", "cyclonedx-bom>=4"]

[project.urls]
Homepage = "https://github.com/BehnamJalaliCo/CodeCortex"
Repository = "https://github.com/BehnamJalaliCo/CodeCortex"
Issues = "https://github.com/BehnamJalaliCo/CodeCortex/issues"
Security = "https://github.com/BehnamJalaliCo/CodeCortex/security"
Documentation = "https://behnamjalalico.github.io/CodeCortex/"

[project.scripts]
codecortex-context-engine = "codecortex.entrypoint:app"
codecortex = "codecortex.entrypoint:app"
cortex = "codecortex.entrypoint:app"
cortex-remote = "codecortex.distributed.cli:app"
cortex-api = "codecortex.api.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/codecortex"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
branch = true
source = ["codecortex"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/codecortex/mcp/server.py" = ["I001"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["codecortex"]

[[tool.mypy.overrides]]
# Optional extras without published type information, each imported behind a
# guard and not installed in the type-check job.
module = ["sentence_transformers.*", "tree_sitter_language_pack.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# defusedxml mirrors the stdlib API but ships no type information.
module = ["defusedxml.*"]
ignore_missing_imports = true

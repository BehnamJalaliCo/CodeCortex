site_name: CodeCortex Context Engine
site_description: Open-source context intelligence infrastructure for AI coding agents
repo_name: BehnamJalaliCo/CodeCortex
repo_url: https://github.com/BehnamJalaliCo/CodeCortex
site_url: https://behnamjalalico.github.io/CodeCortex/
theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
nav:
  - Home: index.md
  - Getting Started: GETTING_STARTED.md
  - Architecture: ARCHITECTURE.md
  - Integrations: INTEGRATIONS.md
  - Evidence Fusion: EVIDENCE_FUSION.md
  - Advanced Intelligence: ADVANCED_INTELLIGENCE.md
  - Distributed: DISTRIBUTED.md
  - Platform:
      - Overview: platform/README.md
      - API: platform/api.md
      - Administration: platform/admin.md
      - API Compatibility: platform/api-compatibility.md
      - Development: platform/development.md
  - Quality: QUALITY.md
  - Benchmarks: BENCHMARKS.md
  - Testing: TESTING.md
  - Packaging: PACKAGING.md
  - Licensing: LICENSING.md
  - Release: RELEASE.md
  - OpenSSF: OPENSSF.md

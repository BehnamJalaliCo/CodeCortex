name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  WORKFLOW_IDENTITY_REF: ${{ github.event_name == 'workflow_dispatch' && 'refs/heads/main' || format('refs/tags/{0}', github.ref_name) }}

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: python scripts/release_check.py --tag "${{ env.RELEASE_TAG }}"
      - run: ruff check .
      - run: pytest -q
      - run: cortex --help
      - run: cortex version

  build-and-sign:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip build twine cyclonedx-bom
      - run: python scripts/release_check.py --tag "${{ env.RELEASE_TAG }}"
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Wheel smoke test
        run: |
          python -m venv /tmp/release-smoke
          /tmp/release-smoke/bin/pip install dist/*.whl
          /tmp/release-smoke/bin/cortex version
      - name: Generate checksums
        run: (cd dist && sha256sum * > SHA256SUMS)
      - name: Generate CycloneDX SBOM
        run: cyclonedx-py environment --output-format JSON --output-file dist/codecortex.cdx.json
      - name: Sigstore-sign release payloads
        uses: sigstore/gh-action-sigstore-python@5b79a39c381910c090341a2c9b0bf022c8b387e1 # v3.4.0
        with:
          inputs: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/codecortex.cdx.json
          verify: true
          verify-cert-identity: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ env.WORKFLOW_IDENTITY_REF }}
          verify-oidc-issuer: https://token.actions.githubusercontent.com
      - name: GitHub build-provenance attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/codecortex.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error
          retention-days: 90

  github-release:
    needs: build-and-sign
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-assets
          path: dist
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${{ env.RELEASE_TAG }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "${{ env.RELEASE_TAG }}" dist/* --repo "${{ github.repository }}" --clobber
            gh release edit "${{ env.RELEASE_TAG }}" --repo "${{ github.repository }}" --generate-notes --title "CodeCortex Context Engine ${{ env.RELEASE_TAG }}"
          else
            gh release create "${{ env.RELEASE_TAG }}" dist/* --repo "${{ github.repository }}" --verify-tag --generate-notes --title "CodeCortex Context Engine ${{ env.RELEASE_TAG }}"
          fi

  publish-pypi:
    if: vars.PYPI_PUBLISH_ENABLED == 'true'
    needs: build-and-sign
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/codecortex-context-engine
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-assets
          path: release-assets
      - name: Keep only PyPI distributions
        run: |
          mkdir dist
          cp release-assets/*.whl release-assets/*.tar.gz dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/
          skip-existing: true

  publish-containers:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: core
            suffix: ""
            platforms: linux/amd64,linux/arm64
          - target: full
            suffix: -full
            platforms: linux/amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        name: Compute image name
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}${{ matrix.suffix }}" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ env.RELEASE_TAG }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha,scope=release-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.target }}
      - name: Attest container provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

name: Backend Conformance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".gitmodules", "vendor/**", "src/codecortex/backends/**", "src/codecortex/context/integrated.py", "scripts/backend_conformance.py", ".github/workflows/backend-conformance.yml", "pyproject.toml"]
  pull_request:
    paths: [".gitmodules", "vendor/**", "src/codecortex/backends/**", "src/codecortex/context/integrated.py", "scripts/backend_conformance.py", ".github/workflows/backend-conformance.yml", "pyproject.toml"]
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  codecortex-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        backend: [graph, symbols, context]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip uv
      - run: pip install -e ".[dev]"
      - run: python scripts/backend_conformance.py "${{ matrix.backend }}"

  source-regression:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: graph, path: vendor/graph-engine, install: "uv sync --group dev", test: "uv run pytest -q"}
          - {name: symbols, path: vendor/symbol-engine, install: "uv sync --extra dev", test: "uv run pytest -q test -m 'not slow'"}
          - {name: context, path: vendor/context-engine, install: "uv sync --extra dev --extra mcp --extra code", test: "uv run pytest -q tests"}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install uv
      - working-directory: ${{ matrix.path }}
        run: ${{ matrix.install }}
      - working-directory: ${{ matrix.path }}
        run: ${{ matrix.test }}

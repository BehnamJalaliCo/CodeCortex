name: Backend Conformance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/codecortex/backends/**"
      - "src/codecortex/context/integrated.py"
      - "scripts/backend_conformance.py"
      - ".github/workflows/backend-conformance.yml"
      - "pyproject.toml"
  pull_request:
    paths:
      - "src/codecortex/backends/**"
      - "src/codecortex/context/integrated.py"
      - "scripts/backend_conformance.py"
      - ".github/workflows/backend-conformance.yml"
      - "pyproject.toml"
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  codecortex-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        backend: [graph, symbols, context]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install tooling
        run: python -m pip install --upgrade pip uv
      - name: Install CodeCortex
        run: pip install -e ".[dev]"
      - name: Provision and exercise pinned backend
        run: python scripts/backend_conformance.py "${{ matrix.backend }}"

  upstream-regression:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: graph-engine
            repository: Graphify-Labs/graphify
            ref: 33362d969292b57eda82f3fbd9eb5f3f5bc9bbc2
            install: uv sync --group dev
            test: uv run pytest -q
          - name: symbol-engine
            repository: oraios/serena
            ref: 43ae0211d7f3bba4101cd0552707fa21d37f4c84
            install: uv sync --extra dev
            test: uv run pytest -q test -m "not slow"
          - name: context-engine
            repository: headroomlabs-ai/headroom
            ref: 65477f933a775bd519d4b037d31d93b3e255e297
            install: uv sync --extra dev --extra mcp --extra code
            test: uv run pytest -q tests
    steps:
      - uses: actions/checkout@v4
        with:
          repository: "${{ matrix.repository }}"
          ref: "${{ matrix.ref }}"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install uv
      - name: Install pinned source
        run: ${{ matrix.install }}
      - name: Run upstream regression suite
        run: ${{ matrix.test }}

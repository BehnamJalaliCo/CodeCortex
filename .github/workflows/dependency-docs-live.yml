name: Dependency Docs Live Smoke

on:
  push:
    branches: [main]
    paths:
      - "src/codecortex/dependencies/**"
      - "tests/test_dependency_live_smoke.py"
      - ".github/workflows/dependency-docs-live.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CODECORTEX_DEPENDENCY_DOCS_API_KEY: ${{ secrets.CODECORTEX_DEPENDENCY_DOCS_API_KEY }}
      CODECORTEX_DEPENDENCY_DOCS_BASE_URL: ${{ vars.CODECORTEX_DEPENDENCY_DOCS_BASE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Check credential availability
        id: credential
        shell: bash
        run: |
          if [ -n "${CODECORTEX_DEPENDENCY_DOCS_API_KEY:-}" ] && [ -n "${CODECORTEX_DEPENDENCY_DOCS_BASE_URL:-}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Run real documentation smoke tests
        if: steps.credential.outputs.available == 'true'
        run: pytest -q tests/test_dependency_live_smoke.py -rs
      - name: Record credential-gated skip
        if: steps.credential.outputs.available != 'true'
        run: |
          echo "SKIPPED — dependency documentation provider URL or credential unavailable" | tee -a "$GITHUB_STEP_SUMMARY"

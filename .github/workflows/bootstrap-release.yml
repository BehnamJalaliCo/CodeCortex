name: Bootstrap Release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bootstrap-release.yml

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Create v0.1.0a2 release tag from validated main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Behnam Jalali"
          git config user.email "behnamjalalico@gmail.com"
          if git rev-parse -q --verify refs/tags/v0.1.0a2 >/dev/null; then
            echo "v0.1.0a2 already exists"
          else
            git tag -a v0.1.0a2 -m "CodeCortex Context Engine v0.1.0a2"
            git push origin refs/tags/v0.1.0a2
          fi
      - name: Dispatch release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --ref main -f tag=v0.1.0a2

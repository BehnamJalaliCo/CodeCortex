name: CI

on:
  push:
    branches: [main, stabilization-1-10]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,web]"
      - run: ruff check .
      - run: mypy
      - name: Tests
        run: |
          if [ "${{ matrix.python-version }}" = "3.13" ]; then
            pytest -q --cov=codecortex --cov-report=xml --cov-report=term-missing --cov-fail-under=90
          else
            pytest -q
          fi
      - name: Upload coverage
        if: matrix.python-version == '3.13' && !cancelled()
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          use_oidc: true
          files: ./coverage.xml
          fail_ci_if_error: false

  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Correctness and fault invariants
        run: >-
          pytest -q
          tests/test_invariant_suite.py
          tests/test_incremental_graph.py
          tests/test_state_concurrency.py
          tests/test_mcp_hardening.py
          tests/test_distributed_security_regressions.py
          tests/test_distributed_v2.py
          tests/test_unified_language_pipeline.py
          tests/test_retrieval_v2.py
          tests/test_evidence_fusion.py
          tests/test_evidence_invariants.py
          tests/test_evidence_acceptance.py
          tests/test_evidence_security.py
          tests/test_evidence_surfaces.py
          tests/test_precision_intelligence.py
          tests/test_precision_semantics.py
          tests/test_precision_conformance.py
          tests/test_real_index_conformance.py
          tests/test_precision_generator.py
          tests/test_dependency_intelligence.py
          tests/test_dependency_contract.py
          tests/test_structural_intelligence.py

  platform-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,web]"
      - run: python scripts/check_platform_architecture.py
      - run: python scripts/check_platform_priorities.py
      - run: pytest -q tests/test_platform_acceptance.py tests/test_platform_layout.py tests/test_platform_manifest.py tests/test_platform_milestones.py tests/test_platform_governance.py tests/test_platform_dod.py tests/test_api_versioning.py tests/test_api_security_hardening.py tests/test_sdk_client.py

  windows-compat:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,web]"
      - run: ruff check .
      - run: pytest -q
      - run: cortex --help
      - run: cortex version

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - run: python scripts/check_readme.py
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - run: pip install dist/*.whl
      - run: cortex --help
      - run: cortex version
      - run: cortex-remote --help

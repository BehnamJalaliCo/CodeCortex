name: Apply Windows Release Fix

on:
  push:
    branches: [fix/windows-release-a2]
    paths:
      - scripts/apply_windows_release_fix.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/windows-release-a2
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Apply cross-platform release fixes
        run: python scripts/apply_windows_release_fix.py
      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git add src/codecortex/distributed/vector_store.py src/codecortex/evaluation/production.py pyproject.toml
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No patch changes were required."
            exit 0
          fi
          git config user.name "Behnam Jalali"
          git config user.email "behnamjalalico@gmail.com"
          git commit -m "Fix Windows release compatibility and prepare 0.1.0a3"
          git push origin HEAD:fix/windows-release-a2

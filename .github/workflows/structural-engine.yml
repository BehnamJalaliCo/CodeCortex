name: Structural Engine

# The structural engine is an optional extra. Core CI runs the structural tests
# against an in-repository stub, so this workflow is the one place the real,
# version-pinned binary is exercised. No credentials are required.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/codecortex/structural/**"
      - "tests/test_structural_intelligence.py"
      - "tests/fixtures/structural_engine.py"
      - "pyproject.toml"
      - ".github/workflows/structural-engine.yml"
  pull_request:
    paths:
      - "src/codecortex/structural/**"
      - "tests/test_structural_intelligence.py"
      - "tests/fixtures/structural_engine.py"
      - "pyproject.toml"
      - ".github/workflows/structural-engine.yml"

permissions:
  contents: read

jobs:
  structural-engine:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,structural]"
      - name: Confirm the engine is installed
        run: ast-grep --version
      - name: Structural search, preview, and guarded apply
        run: pytest -q tests/test_structural_intelligence.py tests/test_evidence_benchmark.py
      - name: Measured evidence benchmark
        run: |
          cortex evidence-benchmark --output benchmarks/evidence.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: evidence-benchmark-${{ matrix.python-version }}
          path: benchmarks/evidence.json
          if-no-files-found: warn

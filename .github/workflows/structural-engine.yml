name: Structural Engine

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/codecortex/structural/**"
      - "tests/test_structural_intelligence.py"
      - "tests/fixtures/structural_engine.py"
      - ".github/workflows/structural-engine.yml"
  pull_request:
    paths:
      - "src/codecortex/structural/**"
      - "tests/test_structural_intelligence.py"
      - "tests/fixtures/structural_engine.py"
      - ".github/workflows/structural-engine.yml"

permissions:
  contents: read

jobs:
  structural-engine:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Structural adapter and guarded rewrite tests
        run: pytest -q tests/test_structural_intelligence.py tests/test_evidence_benchmark.py

name: Production Benchmark

on:
  workflow_dispatch:
    inputs:
      provision:
        description: Provision pinned mature backends
        required: false
        default: true
        type: boolean
  push:
    branches: [main]
    paths:
      - ".gitmodules"
      - "vendor/**"
      - "benchmarks/production/**"
      - "scripts/run_production_benchmark.py"
      - "src/codecortex/evaluation/production.py"
      - "src/codecortex/backends/**"
      - ".github/workflows/production-benchmark.yml"
  schedule:
    - cron: "41 4 * * 0"

permissions:
  contents: read

jobs:
  production-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CODECORTEX_BACKEND_HOME: ${{ github.workspace }}/.benchmark-cache/backends
      CODECORTEX_SOURCE_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: .benchmark-cache
          key: codecortex-benchmark-${{ runner.os }}-${{ hashFiles('src/codecortex/backends/spec.py', '.gitmodules') }}
          restore-keys: |
            codecortex-benchmark-${{ runner.os }}-
      - name: Install tooling
        run: |
          python -m pip install --upgrade pip uv
          pip install -e ".[dev]"
      - name: Run revision-pinned benchmark matrix
        run: |
          EXTRA="--provision"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.provision }}" != "true" ]; then
            EXTRA=""
          fi
          python scripts/run_production_benchmark.py $EXTRA --output benchmark-results.json
      - name: Publish benchmark summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          p=json.load(open('benchmark-results.json', encoding='utf-8'))
          print('# CodeCortex production benchmark')
          print('| Scenario | Completed | Success | Avg ms | Avg est. tokens |')
          print('|---|---:|---:|---:|---:|')
          for name,row in p.get('summary',{}).items():
              print(f"| {name} | {row.get('completed')} | {row.get('success_rate')} | {row.get('avg_wall_time_ms')} | {row.get('avg_estimated_context_tokens')} |")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: codecortex-production-benchmark-${{ github.sha }}
          path: benchmark-results.json
          if-no-files-found: error
          retention-days: 90

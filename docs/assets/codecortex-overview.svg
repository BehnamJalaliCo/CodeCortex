<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
<title id="title">CodeCortex Context Engine overview</title>
<desc id="desc">A product overview showing AI coding agents connected through MCP to repository, symbol, retrieval, Git, memory, architecture, impact, and guarded edit intelligence.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0b1020"/>
    <stop offset="1" stop-color="#111827"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#60a5fa"/>
    <stop offset="1" stop-color="#a78bfa"/>
  </linearGradient>
</defs>
<rect width="1400" height="760" rx="28" fill="url(#bg)"/>
<text x="70" y="92" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="42" font-weight="700">CodeCortex Context Engine</text>
<text x="70" y="137" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24">Context intelligence infrastructure for AI coding agents</text>
<rect x="70" y="188" width="1260" height="2" fill="url(#accent)"/>

<rect x="70" y="244" width="250" height="120" rx="18" fill="#172033" stroke="#334155"/>
<text x="195" y="287" text-anchor="middle" fill="#e2e8f0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700">AI Coding Agents</text>
<text x="195" y="320" text-anchor="middle" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">Claude · Codex · Cursor</text>
<text x="195" y="347" text-anchor="middle" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">Gemini · OpenCode</text>

<path d="M330 304 H470" stroke="#60a5fa" stroke-width="4" marker-end="url(#arrow)"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#60a5fa"/></marker></defs>

<rect x="480" y="224" width="440" height="160" rx="22" fill="#111c30" stroke="#475569"/>
<text x="700" y="270" text-anchor="middle" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700">MCP / CodeCortex Gateway</text>
<text x="700" y="307" text-anchor="middle" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19">Task routing · evidence fusion · context budgeting</text>
<text x="700" y="339" text-anchor="middle" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19">provenance · uncertainty · validation</text>

<path d="M930 304 H1070" stroke="#a78bfa" stroke-width="4" marker-end="url(#arrow2)"/>
<defs><marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a78bfa"/></marker></defs>

<rect x="1080" y="244" width="250" height="120" rx="18" fill="#172033" stroke="#334155"/>
<text x="1205" y="287" text-anchor="middle" fill="#e2e8f0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700">Agent-ready Context</text>
<text x="1205" y="320" text-anchor="middle" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">smaller · ranked · traced</text>
<text x="1205" y="347" text-anchor="middle" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">source-linked evidence</text>


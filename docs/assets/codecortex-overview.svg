<rect x="70" y="612" width="1260" height="78" rx="18" fill="#0f172a" stroke="#334155"/>
<text x="700" y="650" text-anchor="middle" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700">Retrieve evidence before generating confidence.</text>
<text x="700" y="678" text-anchor="middle" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Local-first core · explicit provenance · bounded context · reproducible release evidence</text>

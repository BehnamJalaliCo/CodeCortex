  <rect x="700" y="448" width="190" height="100" rx="16" fill="#132238" stroke="#334155"/>
  <text x="795" y="488" text-anchor="middle" fill="#e2e8f0" font-size="19" font-weight="700">Git + PR Intel</text>
  <text x="795" y="520" text-anchor="middle" fill="#94a3b8" font-size="15">history · ownership · risk</text>

  <rect x="910" y="448" width="190" height="100" rx="16" fill="#132238" stroke="#334155"/>
  <text x="1005" y="488" text-anchor="middle" fill="#e2e8f0" font-size="19" font-weight="700">Memory + Architecture</text>
  <text x="1005" y="520" text-anchor="middle" fill="#94a3b8" font-size="15">decisions · drift · workspace</text>

  <rect x="1120" y="448" width="210" height="100" rx="16" fill="#132238" stroke="#334155"/>
  <text x="1225" y="488" text-anchor="middle" fill="#e2e8f0" font-size="19" font-weight="700">Impact + Guarded Edits</text>
  <text x="1225" y="520" text-anchor="middle" fill="#94a3b8" font-size="15">blast radius · preview · apply</text>
